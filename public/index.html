<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#667eea" />
  <meta name="description" content="Woorkzi - Fikirlerinizi organize edin, projelerinizi hayata geçirin" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Woorkzi">
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="idetree  - Fikir Yönetim Uygulaması">
  <meta property="og:description" content="Fikirlerinizi organize edin, projelerinizi hayata geçirin">
  <meta property="og:image" content="/og-image.png">
  
  <title>idetree  - Fikir Yönetim Uygulaması</title>
  
  <style>
    /* Loading Screen Styles */
    #initial-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      font-family: 'Inter', sans-serif;
    }
    
    .loading-logo {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: bounce 1s infinite;
    }
    
    .loading-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 2rem;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    
    /* Hide loading screen when React loads */
    .app-loaded #initial-loading {
      display: none;
    }
  </style>
</head>
<body>
  <noscript>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
      <h1>🚫 JavaScript Gerekli</h1>
      <p>Bu uygulama JavaScript olmadan çalışmaz. Lütfen tarayıcınızda JavaScript'i etkinleştirin.</p>
    </div>
  </noscript>
  
  <!-- Loading Screen -->
  <div id="initial-loading">
    <div class="loading-logo">💡</div>
    <div class="loading-text">Woorkzi</div>
    <div class="loading-spinner"></div>
  </div>
  
  <!-- React Root Element -->
  <div id="root"></div>
  
  <script>
    // Loading screen'i React yüklendikten sonra gizle
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.body.classList.add('app-loaded');
      }, 500);
    });
  </script>
</body>
</html>
